name: Verify and deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - '.bootstrap/**'
      - '.repair/**'
      - '.github/workflows/complete-repair.yml'
      - '.github/workflows/recover-source.yml'
      - '.github/workflows/prepare-toolchain.yml'
      - '.github/workflows/bootstrap.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require complete application source
        run: test -s package.json && test -s src/App.vue && test -s src/data/guide.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format, types, rules and production build
        run: npm run check
      - name: Install real browser tests
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify HTTP Pages subpath, persistence and accessibility
        run: python tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 30
      - name: Package reproducible source
        run: git archive --format=zip HEAD -o WanderingSwordsGuide-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: site-source
          path: WanderingSwordsGuide-source.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/
          include-hidden-files: true
          retention-days: 30
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static build
        id: deployment
        uses: actions/deploy-pages@v4
