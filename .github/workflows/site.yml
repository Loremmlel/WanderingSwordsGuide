name: Verify and deploy
on:
  push:
    branches: [main]
    paths-ignore: ['.bootstrap/**', '.github/workflows/prepare-toolchain.yml', '.github/workflows/bootstrap.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source is initialized
        id: ready
        run: |
          if [ -f package.json ]; then echo 'value=true' >> "$GITHUB_OUTPUT"; else echo 'value=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.value == 'true'
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        if: steps.ready.outputs.value == 'true'
        run: npm ci
      - name: Format, types, behavioral rules and production build
        if: steps.ready.outputs.value == 'true'
        run: npm run check
      - name: Install browser tests
        if: steps.ready.outputs.value == 'true'
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify real Chromium at a Pages subpath
        if: steps.ready.outputs.value == 'true'
        run: python tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always() && steps.ready.outputs.value == 'true'
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success() && steps.ready.outputs.value == 'true'
        with:
          name: site-dist
          path: dist/
          include-hidden-files: true
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        if: success() && steps.ready.outputs.value == 'true' && github.ref == 'refs/heads/main'
        with:
          path: dist/
    outputs:
      ready: ${{ steps.ready.outputs.value }}
  deploy:
    if: github.ref == 'refs/heads/main' && needs.build.outputs.ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static build
        id: deployment
        uses: actions/deploy-pages@v4
