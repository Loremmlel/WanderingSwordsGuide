name: Prepare initial toolchain
on:
  push:
    paths: ['.github/workflows/prepare-toolchain.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build tools
        run: |
          mkdir workspace && cd workspace
          npm init -y
          npm install --save-exact vue@3 vite@7 @vitejs/plugin-vue@6 typescript@5 vue-tsc@3 prettier@3 axe-core@4
          tar -czf ../vue-toolchain.tgz package.json package-lock.json node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: initial-vue-toolchain
          path: vue-toolchain.tgz
          retention-days: 1
