name: Complete verified source recovery
on:
  push:
    paths: ['.repair/READY']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify both transfers and restore complete source files
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, io, lzma, tarfile, shutil
          def safe(member):
              p = PurePosixPath(member.name)
              return member.isfile() and not p.is_absolute() and '..' not in p.parts and p.parts[0] not in ('.git', '.github', '.bootstrap', '.repair', 'node_modules')
          def write(member, content):
              target = Path(member.name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
          parts = sorted(Path('.bootstrap').glob('part-*.b64'))
          assert len(parts) == 10
          data = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          data = lzma.LZMADecompressor().decompress(data)
          recovered = []
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:') as archive:
              while True:
                  try:
                      member = archive.next()
                      if member is None:
                          break
                      if not safe(member):
                          continue
                      content = archive.extractfile(member).read()
                      assert len(content) == member.size
                      write(member, content)
                      recovered.append(member.name)
                  except (tarfile.ReadError, EOFError):
                      break
          assert Path('public/source/guide.json').is_file() and Path('public/source/assets/image.webp').is_file()
          print('Recovered intact original members:', recovered)
          hashes = ['30c7dc52c6bd4d5bae9631650190520b3018a28f293caa0b674b057e2eb26829', 'a171c5824ddffa188dd02ea1ec59ec0907f2c882dac7651039085434dd6d60b7', 'e80a18983a636d3d643381c61774a622553376f1ec3b4650b058e34dab42d9eb', '8ba20a18d03ac1ef2a220c8231a0c8039d8d8929a470f7247b5c44f7c16f4d6f']
          parts = sorted(Path('.repair').glob('part-*.b64'))
          assert len(parts) == 4
          for part, expected in zip(parts, hashes):
              actual = hashlib.sha256(part.read_text().strip().encode()).hexdigest()
              assert actual == expected, f'{part}: transfer checksum mismatch {actual}'
          data = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          assert hashlib.sha256(data).hexdigest() == '9b24af7950a6730a1adfe1d761d8337349c9326f2b8509e5ccebd5ed3301bb4d'
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:xz') as archive:
              for member in archive.getmembers():
                  assert safe(member), member.name
                  write(member, archive.extractfile(member).read())
          Path('src/data').mkdir(parents=True, exist_ok=True)
          shutil.rmtree('.bootstrap')
          shutil.rmtree('.repair')
          for name in ('bootstrap.yml', 'prepare-toolchain.yml', 'recover-source.yml', 'complete-repair.yml'):
              Path('.github/workflows', name).unlink(missing_ok=True)
          PY
      - run: python scripts/build-content.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Normalize restored configuration and verify final source
        run: npm run format && npm run check
      - name: Commit complete readable source without rewriting history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: restore complete story-first Vue guide with 21 chapters and 161 tasks'
          git push origin HEAD:main
          git archive --format=zip HEAD -o WanderingSwordsGuide-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: restored-source
          path: WanderingSwordsGuide-source.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: restored-dist
          path: dist/
          include-hidden-files: true
          retention-days: 30
