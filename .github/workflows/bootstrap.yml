name: Import verified initial source
on:
  push:
    paths: ['.bootstrap/READY']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack initial source
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, io, tarfile, shutil
          parts = sorted(Path('.bootstrap').glob('part-*.b64'))
          assert len(parts) == 14, 'Incomplete source transfer'
          data = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          assert hashlib.sha256(data).hexdigest() == 'e2e67d547cf7cf6e3ffa02dd8c11f9e4d403b20992a2c61771628b7b1421954e', 'Source checksum mismatch'
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:xz') as archive:
              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  assert member.isfile() and not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] not in ('.git', '.github', '.bootstrap', 'node_modules')
                  target = Path(str(path))
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.extractfile(member).read())
          shutil.rmtree('.bootstrap')
          PY
      - name: Commit readable source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: ship story-first Vue guide with 21 chapters and 172 sourced tasks'
          git push origin HEAD:main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify and build
        run: npm ci && npm run check
      - name: Install browser tests
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test real HTTP Chromium workflow
        run: python tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: initial-browser-evidence
          path: test-results/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: initial-site-dist
          path: dist/
          include-hidden-files: true
          retention-days: 30
