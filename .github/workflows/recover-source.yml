name: Recover interrupted source transfer
on:
  push:
    paths: ['.github/workflows/recover-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover complete archive members without changing main
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, lzma, io, tarfile, json
          parts = sorted(Path('.bootstrap').glob('part-*.b64'))
          encoded = ''.join(p.read_text().strip() for p in parts)
          compressed = base64.b64decode(encoded, validate=True)
          decoder = lzma.LZMADecompressor()
          data = decoder.decompress(compressed)
          output = Path('recovered-source')
          output.mkdir()
          report = {'parts': len(parts), 'archiveComplete': decoder.eof, 'compressedBytes': len(compressed), 'recoveredBytes': len(data), 'files': [], 'truncatedAt': None}
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:') as archive:
              while True:
                  try:
                      member = archive.next()
                      if member is None:
                          break
                      path = PurePosixPath(member.name)
                      if not member.isfile() or path.is_absolute() or '..' in path.parts or path.parts[0] in ('.git', '.github', '.bootstrap', 'node_modules'):
                          continue
                      content = archive.extractfile(member).read()
                      if len(content) != member.size:
                          report['truncatedAt'] = str(path)
                          break
                      target = output / str(path)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(content)
                      report['files'].append({'path': str(path), 'size': len(content)})
                  except (tarfile.ReadError, EOFError) as error:
                      report['truncatedAt'] = str(error)
                      break
          (output / 'RECOVERY-REPORT.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-source
          path: recovered-source/
          include-hidden-files: true
          retention-days: 7
